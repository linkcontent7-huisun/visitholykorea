  <head>

    <meta
      name="description"
      content="붐비는 관광지 대신 마음에 필요한 쉼표 하나. 감정 기반 한국 가톨릭 성지순례 추천."
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Visit Holy Korea" />
    <meta property="og:title" content="Visit Holy Korea - 길 위에서 나를 만나는 성지순례" />
    <meta
      property="og:description"
      content="붐비는 관광지 대신 마음에 필요한 쉼표 하나. 감정 기반 한국 가톨릭 성지순례 추천."
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>

    <!--
      자가 복구 장치 — 흰 화면을 스스로 고친다.

      2026-09-01 에 최신 정규식 문법 한 줄이 구형 아이폰에서 앱 전체를 죽였다.
      코드는 곧바로 고쳤지만, **이미 열어본 휴대폰은 고장난 버전을 저장해 두고
      계속 그것만 보여준다**(서비스워커 캐시). 사용자는 앱이 아직도 고장난 줄 안다.
      실제로 배포 사흘 뒤에도 "작동이 안 된다"는 제보를 받았다.

      그래서 8초가 지나도 화면이 비어 있으면, 저장된 것을 지우고 한 번만 다시 연다.
      한 번만 하는 이유는 무한 새로고침을 막기 위해서다. 그래도 안 되면
      사람이 읽을 수 있는 안내를 남긴다 — 흰 화면보다는 낫다.

      이 스크립트는 구형 브라우저도 반드시 읽을 수 있어야 하므로
      화살표 함수·const 같은 최신 문법을 쓰지 않는다. 그게 이 장치의 존재 이유다.
    -->
    <script>
      (function () {
        var KEY = 'vhk_recovered_at';
        setTimeout(function () {
          var root = document.getElementById('root');
          if (root && root.children.length > 0) return; // 정상

          var last = 0;
          try { last = parseInt(sessionStorage.getItem(KEY) || '0', 10); } catch (e) {}
          if (last) {
            root.innerHTML =
              '<div style="padding:32px;font-family:system-ui,sans-serif;line-height:1.7;color:#334155">' +
              '<p style="font-weight:800;font-size:18px;margin:0 0 12px">화면을 불러오지 못했어요</p>' +
              '<p style="margin:0 0 8px">브라우저를 완전히 닫았다가 다시 열어 주세요.</p>' +
              '<p style="margin:0;font-size:13px;color:#64748b">계속 안 되면 Chrome 또는 Safari 로 열어보시거나, ' +
              '카카오톡 안에서 여셨다면 오른쪽 아래 메뉴에서 "다른 브라우저로 열기"를 눌러 주세요.</p></div>';
            return;
          }

          try { sessionStorage.setItem(KEY, String(Date.now())); } catch (e) {}

          var done = function () { location.reload(); };
          try {
            if (window.caches && caches.keys) {
              caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) { return caches.delete(k); }));
              }).catch(function () {});
            }
            if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
              navigator.serviceWorker.getRegistrations().then(function (rs) {
                return Promise.all(rs.map(function (r) { return r.unregister(); }));
              }).then(done).catch(done);
            } else {
              done();
            }
          } catch (e) { done(); }
        }, 8000);
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
